[package]
name = "waterui-barcode-mounted-tests"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.95"
description = "Mounted end-to-end tests for waterui-barcode through a real backend runtime"

# These tests drive a real backend runtime (`waterui-testing` + `hydrolysis` +
# `hydrolysis-m3`). Their Cherenkov ports are still in flight
# (`feat/cherenkov-migration` heads pinned in the workspace patch table), so
# they live in their own package: `cargo test -p waterui-barcode` exercises the
# crate's own suite while this package's targets are the only ones that do not
# build until the ported backend revisions land.
[dev-dependencies]
waterui-barcode = { path = "../.." }
waterui = "0.5.0"
waterui-testing = "0.5.0"
# The layout tests mount a scroll view, whose scrollbars need a widget theme the
# default test theme does not carry.
hydrolysis-m3 = "0.3.0"
