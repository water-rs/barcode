[workspace]
members = ["examples/barcode", "tests/mounted"]
resolver = "2"

[package]
name = "waterui-barcode"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/barcode"
description = "WaterUI barcode and QR code component"
keywords = ["vector", "barcode", "qrcode", "waterui"]
categories = ["graphics", "rendering", "gui"]

[features]
default = []
# Rasterizing a barcode into a standalone `OffscreenImage` needs a GPU device,
# so `BarcodeSource::generate` is the one part of this crate that pulls
# `waterui-graphics`' GPU stack. Drawing a barcode into a scene does not.
gpu = ["waterui-graphics/gpu"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[dependencies]
nami = "0.12"
waterui-core = "0.5.1"
waterui-graphics = { version = "0.5.1", default-features = false }
kurbo = "0.13"
fast_qr = "0.13"
barcoders = { version = "2.0.0", default-features = false }
thiserror = "2.0.19"

[dev-dependencies]
pollster = "1.0"
rxing = { version = "0.9.2", default-features = false, features = ["decoders", "encoding_rs", "oned", "qrcode"] }
# The offscreen round-trip tests rasterize the scene through a real GPU
# engine, which is `waterui-graphics`' `gpu` half rather than the scene
# contract the library itself draws through.
waterui-graphics = { version = "0.5.1", features = ["gpu"] }

# Third-party forks and unreleased water-rs crates the framework itself
# patches; a registry dependency does not carry its own patch table, so they
# are repeated here so this graph resolves the same sources as
# water-rs/waterui `dev` at `0b9829612`, the head carrying the
# render-target-neutral recording contract (water-rs/waterui#1435):
# `SceneContent::build_scene` records into `waterui_graphics::draw`
# (`cherenkov_record::Recorder`) and `SceneResources::new` takes the target's
# `SceneBackend`/`ShaderBackend` registry.
[patch.crates-io]
# The crate under test stands in for the published `waterui-barcode` the
# facade and testing harness ask for.
waterui-barcode = { path = "." }

xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }

# nami#26 renames `Signal::get` to `Signal::snapshot`; drop once released.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }

# codec asks for shaderloom's `runtime` feature, added after the 0.1.2
# registry release — the rev the framework's own patch table pins.
shaderloom = { git = "https://github.com/water-rs/shaderloom", rev = "b0b6870c8b560d902c1de9a4d039c3a921b18b92" }

# Every `waterui-*` crate in the graph must resolve to this one rev — a
# registry `waterui-core` beside the facade's own path dependencies gives two
# `View` traits in one graph.
waterui = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
