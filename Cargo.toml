[package]
name = "waterui-barcode"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/barcode"
description = "WaterUI barcode and QR code component"
keywords = ["gpu", "barcode", "qrcode", "waterui"]
categories = ["graphics", "rendering", "gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[dependencies]
nami = "0.11.0"
waterui-core = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev" }
waterui-graphics = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev", features = ["gpu"] }
shaderloom = "0.1.0"
wgpu = "29.0.4"
bytemuck = { version = "1.25", features = ["derive"] }
fast_qr = "0.13"
barcoders = { version = "2.0.0", default-features = false }
thiserror = "2.0.19"

[build-dependencies]
shaderloom = { version = "0.1.0", features = ["build"] }

[dev-dependencies]
pollster = "1.0"
rxing = { version = "0.9.2", default-features = false, features = ["decoders", "encoding_rs", "oned", "qrcode"] }
waterui = { git = "https://github.com/water-rs/waterui.git", branch = "dev" }
waterui-testing = { git = "https://github.com/water-rs/waterui.git", branch = "dev" }

[package.metadata.cargo-machete]
ignored = ["shaderloom"]
