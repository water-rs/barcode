[workspace]
members = ["examples/barcode"]
resolver = "2"

[package]
name = "waterui-barcode"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/barcode"
description = "WaterUI barcode and QR code component"
keywords = ["vector", "barcode", "qrcode", "waterui"]
categories = ["graphics", "rendering", "gui"]

[features]
default = []
# Rasterizing a barcode into a `GeneratedImage` needs a GPU device, so the
# `ImageGenerator` implementation is the one part of this crate that pulls
# `waterui-graphics`' GPU stack. Drawing a barcode into a scene does not.
gpu = ["waterui-graphics/gpu"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[dependencies]
nami = "0.11.2"
waterui-core = "0.5.0"
waterui-graphics = { version = "0.5.0", default-features = false }
kurbo = "0.13"
peniko = "0.6"
fast_qr = "0.13"
barcoders = { version = "2.0.0", default-features = false }
thiserror = "2.0.19"

[dev-dependencies]
pollster = "1.0"
rxing = { version = "0.9.2", default-features = false, features = ["decoders", "encoding_rs", "oned", "qrcode"] }
waterui = "0.5.0"
waterui-testing = "0.5.0"
# The layout tests mount a scroll view, whose scrollbars need a widget theme the
# default test theme does not carry.
hydrolysis-m3 = "0.3.0"
# The offscreen round-trip tests rasterize the scene through a real GPU
# surface, which is `waterui-graphics`' `gpu` half rather than the scene
# contract the library itself draws through.
waterui-graphics = { version = "0.5.0", features = ["gpu"] }

# The waterui 0.5.0 release is in its candidate window: the `waterui-*`
# requirements above name the versions the pinned revision provides, and every
# `waterui-*` member this graph resolves comes from that one commit so the
# graph carries exactly one copy of each — a registry crate beside its git
# twin would compile duplicate `View`/`Layout` types. Drop the entries and
# bump the requirements to the released versions once 0.5.0 is on crates.io.
[patch.crates-io]
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "12553db2de92e66ff919f56c6dd98ba42f757a00" }
waterui = { git = "https://github.com/water-rs/waterui", rev = "d6807a87c39b2b3f6e992cd9f205f93a2155ed8b" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "d6807a87c39b2b3f6e992cd9f205f93a2155ed8b" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "d6807a87c39b2b3f6e992cd9f205f93a2155ed8b" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "d6807a87c39b2b3f6e992cd9f205f93a2155ed8b" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "d6807a87c39b2b3f6e992cd9f205f93a2155ed8b" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "d6807a87c39b2b3f6e992cd9f205f93a2155ed8b" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "d6807a87c39b2b3f6e992cd9f205f93a2155ed8b" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "d6807a87c39b2b3f6e992cd9f205f93a2155ed8b" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "d6807a87c39b2b3f6e992cd9f205f93a2155ed8b" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "d6807a87c39b2b3f6e992cd9f205f93a2155ed8b" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "d6807a87c39b2b3f6e992cd9f205f93a2155ed8b" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "d6807a87c39b2b3f6e992cd9f205f93a2155ed8b" }
